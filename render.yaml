databases:
  - name: agrimap-postgres
    plan: free

services:
  # Node.js Backend API (finance/monetization)
  - type: web
    name: agrimap-node-api
    runtime: node
    plan: free
    buildCommand: cd node-agri-map-server && npm install --legacy-peer-deps
    startCommand: cd node-agri-map-server && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: DJANGO_API_URL
        sync: false
      - key: DJANGO_API_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        value: https://agrimap-node-api.onrender.com/api/webhooks
      - key: CORS_ORIGIN
        value: https://agrimap-client.onrender.com,https://agrimap-django-api.onrender.com,http://localhost:3000
      - key: LOG_LEVEL
        value: info

  # Django Backend API (AI/geospatial — source of truth)
  - type: web
    name: agrimap-django-api
    runtime: python
    rootDir: server-agri-map-django
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash startup.sh
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: server_agri_map_django.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agrimap-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        value: agrimap-django-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://agri-map-one.vercel.app
